# 推上 main 分支時，自動打包並發布到 GitHub Pages
# 網址：https://franktang0512.github.io/flowchart/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 GitHub 的 Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個發布，新的推上來就取消還沒跑完的舊發布
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
